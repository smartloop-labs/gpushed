# On a version tag: build the CLI package, the Apple-container client image
# (linux/arm64) and the provisioner image (linux/amd64), and publish them to
# Cloudflare R2, served at vars.GPUSHED_DL (e.g. https://dl.gpushed.dev):
#
#   latest                                     -> "v1.2.3"
#   v1.2.3/gpushed.tar.gz(.sha256)             CLI package (install.sh fetches it)
#   v1.2.3/gpushed-cli-arm64.oci.tar(.sha256)  client image, `container image load`
#   v1.2.3/gpushed-provisioner-amd64.tar.gz(.sha256)  used by provision.yml
#
# and push the provisioner image to Artifact Registry (vars.GCP_PROVISIONER_IMAGE)
# and point the gpushed-provisioner Cloud Run job at it (skipped until
# Bootstrap GCP has set GCP_RELEASE_SERVICE_ACCOUNT).
#
# On main (a push touching site/ or install.sh, or a manual run): publishes the
# website (site/) and install.sh to https://gpushed.dev (a static-assets
# Worker, infra/site/wrangler.toml); the install command is
# curl -fsSL gpushed.dev/install.sh | bash. The site deploys only from main:
# install.sh looks up the latest release itself, so tags don't redeploy it.
#
# Secrets are repository secrets (the repository is private): each job runs
# only on a v* tag or main.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["site/**", "install.sh", ".github/workflows/release.yml"]
  workflow_dispatch: # re-publish the website and installer without a release

permissions:
  contents: write
  id-token: write # Workload Identity Federation (Artifact Registry, Cloud Run)

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      V: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build CLI package
        run: |
          mkdir -p dist build/gpushed
          cp gpushed install.sh build/gpushed/
          cp -R client build/gpushed/client
          echo "$V" > build/gpushed/VERSION
          tar -czf "dist/gpushed.tar.gz" -C build gpushed
          tar -tzf dist/gpushed.tar.gz

      - name: Build client image (Apple container, linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 --build-arg VERSION="$V" \
            --output "type=oci,dest=dist/gpushed-cli-arm64.oci.tar,name=gpushed-cli:$V" -f client/Containerfile client

      - name: Build provisioner image (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 --load -t "gpushed-provisioner:$V" -f provisioner/Containerfile provisioner
          docker save "gpushed-provisioner:$V" | gzip > dist/gpushed-provisioner-amd64.tar.gz

      - name: Smoke test
        run: |
          bash -n gpushed install.sh client/gpushed-cli provisioner/provision.sh provisioner/worker.sh
          docker run --rm --entrypoint provision "gpushed-provisioner:$V" 2>&1 | grep -q usage
          docker buildx build --platform linux/amd64 --load -t gpushed-cli:test -f client/Containerfile client
          docker run --rm gpushed-cli:test gpushed-cli version | grep -q .

      - name: Checksums
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && ls -la

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the CRC checksums newer AWS CLIs add to multipart
          # uploads by default (InvalidPart on CompleteMultipartUpload).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          aws s3 cp dist/ "s3://$BUCKET/$V/" --recursive --endpoint-url "$R2_ENDPOINT"
          # Point "latest" at this release only once all its files are there.
          printf '%s' "$V" | aws s3 cp - "s3://$BUCKET/latest" --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain --cache-control "max-age=60"

      - id: gcp
        name: Check GCP setup
        env:
          RELEASE_SA: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$RELEASE_SA" ]; then
            echo "::warning::GCP_RELEASE_SERVICE_ACCOUNT is not set; run Bootstrap GCP (apply). Not updating the Cloud Run job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.gcp.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp.outputs.skip != 'true'

      - name: Push provisioner image and update the Cloud Run job
        if: steps.gcp.outputs.skip != 'true'
        env:
          IMAGE: ${{ vars.GCP_PROVISIONER_IMAGE }}
          CLOUD_RUN_JOB: ${{ vars.CLOUD_RUN_JOB }} # projects/P/locations/R/jobs/NAME
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker tag "gpushed-provisioner:$V" "$IMAGE:$V"
          docker push -q "$IMAGE:$V"
          # The registry's digest, not the local one buildx --load also records.
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$V" | grep -m1 "^$IMAGE@")
          IFS=/ read -r _ project _ region _ job <<<"$CLOUD_RUN_JOB"
          gcloud run jobs update "$job" --project "$project" --region "$region" --image "$digest" --quiet

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$V" dist/gpushed.tar.gz dist/gpushed.tar.gz.sha256 install.sh --title "$V" --generate-notes

  site:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Build site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp install.sh _site/install.sh
      - run: ../../api/node_modules/.bin/wrangler deploy
        working-directory: infra/site
