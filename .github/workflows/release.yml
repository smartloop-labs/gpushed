# On a version tag: build the CLI package, the Apple-container client image
# (linux/arm64) and the provisioner image (linux/amd64), and publish them to
# Cloudflare R2, served at vars.GPUSHED_DL (e.g. https://dl.gpushed.smartloop.ai):
#
#   latest                                     -> "v1.2.3"
#   v1.2.3/gpushed.tar.gz(.sha256)             CLI package (install.sh fetches it)
#   v1.2.3/gpushed-cli-arm64.oci.tar(.sha256)  client image, `container image load`
#   v1.2.3/gpushed-provisioner-amd64.tar.gz(.sha256)  used by provision.yml
#
# Also publishes the website (site/) and install.sh to https://gpushed.smartloop.ai
# via GitHub Pages; the install command is curl -fsSL gpushed.smartloop.ai/install.sh | bash
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-publish the website and installer without a release

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # R2 release keys; the environment allows v* tags
    env:
      V: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build CLI package
        run: |
          mkdir -p dist build/gpushed
          cp gpushed install.sh build/gpushed/
          cp -R client build/gpushed/client
          echo "$V" > build/gpushed/VERSION
          tar -czf "dist/gpushed.tar.gz" -C build gpushed
          tar -tzf dist/gpushed.tar.gz

      - name: Build client image (Apple container, linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 --build-arg VERSION="$V" \
            --output "type=oci,dest=dist/gpushed-cli-arm64.oci.tar,name=gpushed-cli:$V" -f client/Containerfile client

      - name: Build provisioner image (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 --load -t "gpushed-provisioner:$V" -f provisioner/Containerfile provisioner
          docker save "gpushed-provisioner:$V" | gzip > dist/gpushed-provisioner-amd64.tar.gz

      - name: Smoke test
        run: |
          bash -n gpushed install.sh client/gpushed-cli provisioner/provision.sh
          docker run --rm --entrypoint provision "gpushed-provisioner:$V" 2>&1 | grep -q usage
          docker buildx build --platform linux/amd64 --load -t gpushed-cli:test -f client/Containerfile client
          docker run --rm gpushed-cli:test gpushed-cli version | grep -q .

      - name: Checksums
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && ls -la

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the CRC checksums newer AWS CLIs add to multipart
          # uploads by default (InvalidPart on CompleteMultipartUpload).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          aws s3 cp dist/ "s3://$BUCKET/$V/" --recursive --endpoint-url "$R2_ENDPOINT"
          # Point "latest" at this release only once all its files are there.
          printf '%s' "$V" | aws s3 cp - "s3://$BUCKET/latest" --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain --cache-control "max-age=60"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$V" dist/gpushed.tar.gz dist/gpushed.tar.gz.sha256 install.sh --title "$V" --generate-notes

  pages:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp install.sh _site/install.sh
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
